<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(1200px 700px at 80% -10%,#2a5a40 0%,#183827 45%,#0f2419 100%);color:#f5f1e6;display:grid;place-items:center;padding:20px}
.box{width:100%;max-width:380px;text-align:center}
img{width:170px;height:auto;margin:0 auto 18px;display:block}
h1{font-size:20px;font-weight:650;margin:0 0 4px} p{margin:0 0 22px;color:rgba(245,241,230,.72);font-size:13.5px}
form{background:rgba(255,255,255,.06);border:1px solid rgba(200,168,107,.35);border-radius:16px;padding:20px;backdrop-filter:blur(6px)}
label{display:block;text-align:left;font-size:12.5px;color:#e9d8b1;margin-bottom:6px;letter-spacing:.3px}
input[type=password]{width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);color:#fff;font-size:16px;letter-spacing:1px;outline:none}
input[type=password]:focus{border-color:#c8a86b;box-shadow:0 0 0 3px rgba(200,168,107,.25)}
.lem{display:flex;gap:8px;align-items:center;margin:12px 0 16px;font-size:13px;color:rgba(245,241,230,.8);text-align:left}
button{width:100%;padding:12px;border:0;border-radius:10px;background:#c8a86b;color:#141813;font-weight:700;font-size:15px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{min-height:20px;margin-top:10px;color:#ffb4a8;font-size:13px}
.foot{margin-top:18px;font-size:11.5px;color:rgba(245,241,230,.5)}
</style></head><body>

const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
async function abrir(key){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(P.iv)}, key, u8(P.ct));
  const html = new TextDecoder().decode(pt); document.open(); document.write(html); document.close();
}
async function chave(senha){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:u8(P.salt), iterations:P.it, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
(async () => { try { const k = localStorage.getItem('ps-k-' + P.v); if (k){ await abrir(await crypto.subtle.importKey('raw', u8(k), 'AES-GCM', false, ['decrypt'])); } } catch(e){ try{ localStorage.removeItem('ps-k-' + P.v); }catch(_){} } })();
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault(); const b = document.getElementById('b'), e = document.getElementById('e'); b.disabled = true; b.textContent = 'Abrindo…'; e.textContent = '';
  try { const k = await chave(document.getElementById('s').value.trim());
    if (document.getElementById('lem').checked){ try{ localStorage.setItem('ps-k-' + P.v, b64(await crypto.subtle.exportKey('raw', k))); }catch(_){} }
    await abrir(k);
  } catch(err){ e.textContent = 'Senha incorreta. Tente novamente.'; b.disabled = false; b.textContent = 'Entrar'; }
});
